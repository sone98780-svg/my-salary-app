<!-- _css.html: 디자인 코드. Apps Script는 .css 파일을 못 만들어서 <style>로 감싼 html 파일로 둔다 -->
<style>
/*
  ============================================================
  🎨 _css.html — 화면의 "옷" (원본: 저장소 맨 위 style.css 와 같은 내용)
  ------------------------------------------------------------
  - CSS는 색, 크기, 배치(어디에 놓을지)를 정합니다.
  - [덩어리 1] ~ [덩어리 7] 순서로 읽으면 됩니다.
  - 읽는 법:  선택자 { 속성: 값; }
      예) .btn { color: white; }  →  class="btn"인 것의 글자색을 흰색으로
  - 주석 형식
    ** 설명 ** // ** 이유 **
    ** 변경 전 코드 ** // ** 변경 후 코드 **
  ============================================================
*/

/* ==================== [덩어리 1 / 7] 색상표(변수)와 기본 바탕 ==================== */

/* ** 설명: 자주 쓰는 색을 이름표(변수)로 저장한다. --이름 형태 // ** 이유: 보라색을 바꾸고 싶을 때 여기 한 줄만 고치면 전체가 바뀐다 **
   ** 변경 전 코드 ** :root { --primary-color: #6200ee; ... } (예전 대시보드)
   // ** 변경 후 코드 ** --purple: #7e22ce; (신규입사자 양식의 보라색으로 통일) */
:root {
  --purple: #7e22ce;        /* 대표 보라색 */
  --purple-light: #f3e8ff;  /* 연한 보라 (배경용) */
  --purple-dark: #581c87;   /* 진한 보라 (글자 강조) */
  --ink: #1e293b;           /* 기본 글자색 (거의 검정) */
  --muted: #64748b;         /* 흐린 글자 (설명문) */
  --line: #e2e8f0;          /* 테두리 선 */
  --bg: #f6f4fb;            /* 전체 바탕 */
  --card: #ffffff;          /* 카드 바탕 */
  --ok: #15803d;            /* 정상 (초록) */
  --warn: #b91c1c;          /* 경고 (빨강) */
  --radius: 14px;           /* 모서리 둥글기 */
}

/* ** 설명: 모든 요소의 크기 계산 방식을 '테두리 포함'으로 맞춘다 // ** 이유: 이걸 안 하면 width:100% 칸에 여백이 더해져 화면 밖으로 삐져나간다 ** */
* { box-sizing: border-box; }

/* ** 설명: 페이지 전체의 글꼴·바탕색·여백 // ** 이유: 기본값을 한 번 정해 두면 각 칸마다 다시 쓸 필요가 없다 ** */
body {
  margin: 0;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%; /* 아이폰이 글자를 멋대로 키우지 않게 */
}

/* ** 설명: 숨김 표시(hidden)가 붙은 것은 확실히 안 보이게 // ** 이유: display를 따로 지정한 요소는 hidden이 무시될 때가 있어서 ** */
[hidden] { display: none !important; }

/* ==================== [덩어리 2 / 7] 머리말(헤더)과 탭 메뉴 ==================== */

/* ** 설명: 맨 위 보라색 띠. sticky = 스크롤해도 위에 붙어 있음 // ** 이유: 어디까지 내려가도 탭을 바로 누를 수 있게 ** */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;               /* 다른 것보다 위에 겹쳐 보이게 */
  background: linear-gradient(135deg, #a855f7, var(--purple));
  color: #fff;
  padding: 14px 16px 0;
  box-shadow: 0 2px 10px rgba(88, 28, 135, .25);
}

/* ** 설명: 로고와 제목을 가로로 나란히 (flex = 가로 줄 세우기) // ** 이유: 로고 옆에 제목이 붙어 보여야 깔끔하다 ** */
.brand { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; }
.brand-logo {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;   /* 글자 P를 정가운데로 */
  background: #fff; color: var(--purple);
  border-radius: 12px; font-weight: 900; font-size: 20px;
}
.brand h1 { margin: 0; font-size: 18px; letter-spacing: -.3px; word-break: keep-all; }
.app-sub  { margin: 2px 0 0; font-size: 12px; opacity: .85; }

/* ** 설명: 탭 버튼 줄. overflow-x:auto = 폭이 좁으면 옆으로 밀어서 보기 // ** 이유: 폰에서 버튼이 두 줄로 깨지지 않게 ** */
.tabs { display: flex; gap: 4px; max-width: 1100px; margin: 12px auto 0; overflow-x: auto; }
.tab {
  flex: 1;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.8);
  padding: 10px 12px;
  font-size: 14px; font-weight: 700;
  border-radius: 12px 12px 0 0;
  cursor: pointer;
  white-space: nowrap;
}
/* ** 설명: 지금 선택된 탭은 흰 배경 // ** 이유: 내가 어느 화면에 있는지 바로 알 수 있게 ** */
.tab.is-active { background: var(--bg); color: var(--purple-dark); }

/* ==================== [덩어리 3 / 7] 본문 상자(패널)와 입력칸 ==================== */

/* ** 설명: 본문 최대 폭 1100px, 가운데 정렬 // ** 이유: 큰 모니터에서 글줄이 너무 길어지면 읽기 힘들다 ** */
.container { max-width: 1100px; margin: 0 auto; padding: 16px; }

/* ** 설명: 패널은 기본적으로 숨기고, is-shown이 붙은 것만 보인다 // ** 이유: 탭을 누를 때 script.js가 is-shown을 옮겨 붙여 화면을 바꾼다 ** */
.panel { display: none; }
.panel.is-shown { display: block; animation: fadeIn .25s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.panel-title { font-size: 20px; margin: 4px 0 14px; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 12px; background: #fde68a; color: #92400e; padding: 2px 8px; border-radius: 999px; }
.hint { color: var(--muted); font-size: 13px; }

/* ** 설명: 입력칸 묶음 상자(fieldset) 모양 // ** 이유: ①②③④ 덩어리가 눈에 잘 구분되게 ** */
.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px 16px;
  margin: 0 0 14px;
  min-width: 0;   /* fieldset이 폰에서 화면 밖으로 넘치는 브라우저 버그 방지 */
}
.box legend { font-weight: 800; color: var(--purple-dark); padding: 0 6px; }

/* ** 설명: grid = 바둑판 배치. auto-fit + minmax(200px,1fr) = "칸 하나 최소 200px, 들어가는 만큼 한 줄에" // ** 이유: 이 한 줄로 PC는 3~4칸, 폰은 1칸으로 자동 변신한다(반응형 핵심) ** */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

/* ** 설명: 칸 이름(span) 위, 입력칸 아래로 세로 배치 // ** 이유: 폰에서도 이름과 칸이 겹치지 않는다 ** */
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field-wide { grid-column: 1 / -1; }   /* 한 줄 전체를 차지 */
.req { color: var(--warn); }

/* ** 설명: 입력칸·선택칸 공통 모양 // ** 이유: 브라우저마다 기본 모양이 달라서 통일한다. 글자 16px = 아이폰이 입력할 때 화면을 확대하지 않는 크기 ** */
.field input, .field select {
  width: 100%;
  font: inherit; font-size: 16px; color: var(--ink); font-weight: 600;
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
}
.field input:focus, .field select:focus { background: #fff; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(126,34,206,.15); }
.field input[readonly] { background: #eef2f7; color: var(--muted); }
/* ** 설명: 돈 칸은 숫자를 오른쪽 정렬 // ** 이유: 장부처럼 자릿수가 세로로 맞아야 읽기 쉽다 ** */
.field input.money { text-align: right; }
/* ** 설명: 잘못 입력한 칸은 빨간 테두리 // ** 이유: 어느 칸이 문제인지 바로 보이게 ** */
.field input.invalid { border-color: var(--warn); background: #fef2f2; }

/* ** 설명: 월급제/시급제 같은 선택 버튼, 체크박스 줄 // ** 이유: 손가락으로 누르기 쉽게 크게 ** */
.seg, .checks { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label, .checks label {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: #f8fafc; color: var(--ink); cursor: pointer;
}
.seg input, .checks input { accent-color: var(--purple); width: 18px; height: 18px; }

/* ==================== [덩어리 4 / 7] 미리보기 상자와 버튼 ==================== */

/* ** 설명: 계산 미리보기 상자 (진한 남색 배경) // ** 이유: 입력칸과 결과가 확실히 구분되게 ** */
.preview { background: #1e1b4b; color: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.preview h3 { margin: 0 0 10px; font-size: 15px; color: #c4b5fd; }

/* ** 설명: dl(이름-값 목록)을 2열 바둑판으로 // ** 이유: "항목명 … 금액" 형태로 깔끔하게 ** */
.preview-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 20px; margin: 0; }
.preview-list div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed rgba(255,255,255,.15); padding: 4px 0; }
.preview-list dt { opacity: .75; font-size: 13px; }
.preview-list dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; } /* tabular-nums = 숫자 폭을 같게 */
.preview-list .total dd { color: #86efac; font-size: 18px; }
.wage-check { margin: 10px 0 0; font-size: 13px; font-weight: 700; }
.wage-check.ok { color: #86efac; }
.wage-check.bad { color: #fca5a5; }

/* ** 설명: 버튼 줄은 오른쪽 정렬 // ** 이유: '저장'처럼 마지막에 누르는 버튼은 오른쪽에 있는 게 익숙하다 ** */
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 800; cursor: pointer; }
.btn:active { transform: scale(.98); }    /* 누를 때 살짝 들어가는 느낌 */
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--purple); color: #fff; }
.btn-ghost { background: #fff; color: var(--purple-dark); border: 1px solid var(--line); }
.btn-danger { background: #fee2e2; color: var(--warn); }
.btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }

/* ==================== [덩어리 5 / 7] 조회 화면: 검색칸·합계 카드·표 ==================== */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; margin-bottom: 14px; }

/* ** 설명: 합계 카드 3개를 가로로 // ** 이유: 핵심 숫자를 크게 먼저 보여준다 ** */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat strong { font-size: 18px; color: var(--purple-dark); font-variant-numeric: tabular-nums; }

/* ** 설명: 표를 감싸는 상자. overflow-x:auto = 표가 넓으면 상자 안에서만 옆으로 스크롤 // ** 이유: 표 때문에 화면 전체가 옆으로 밀리는 것을 막는다 ** */
.table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger th, .ledger td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.ledger th { background: var(--purple-light); color: var(--purple-dark); font-size: 13px; position: sticky; top: 0; }
.ledger .num { text-align: right; font-variant-numeric: tabular-nums; }
.ledger tbody tr:hover { background: #faf5ff; }
.ledger .ok { color: var(--ok); font-weight: 700; }
.ledger .bad { color: var(--warn); font-weight: 700; }
.ledger td .btn + .btn { margin-left: 4px; }
.settings-table td { white-space: normal; }
.empty { text-align: center; color: var(--muted); padding: 30px 12px; margin: 0; }

/* ==================== [덩어리 6 / 7] 팝업(상세보기)·알림·바닥글 ==================== */

/* ** 설명: 상세보기 팝업 창 모양 // ** 이유: 본문 위에 떠서 집중해서 볼 수 있게 ** */
.dialog { border: 0; border-radius: 18px; padding: 20px; width: min(560px, calc(100% - 32px)); background: #1e1b4b; color: #fff; }
.dialog::backdrop { background: rgba(15, 23, 42, .55); }  /* 팝업 뒤 배경을 어둡게 */
.dialog h3 { margin-top: 0; color: #c4b5fd; }

/* ** 설명: 화면 아래 가운데에 뜨는 알림 // ** 이유: 저장 성공/실패를 방해 없이 알린다 ** */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
  font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 50;
  max-width: calc(100% - 32px);
}
.toast.error { background: var(--warn); }

.app-footer { text-align: center; font-size: 12px; color: var(--muted); padding: 16px 16px 32px; }

/* ==================== [덩어리 7 / 7] 스마트폰용 변신 (반응형) ==================== */
/*
  ** 설명: @media (max-width: 720px) = "화면 폭이 720px 이하일 때만 아래 규칙 적용" // ** 이유: PC와 폰에 같은 HTML을 쓰면서 모양만 바꾸는 방법(반응형) **
*/
@media (max-width: 720px) {
  .container { padding: 12px; }
  .brand h1 { font-size: 15px; }

  /* ** 설명: 합계 카드를 1줄 3칸 → 숫자 작게 // ** 이유: 폰 폭에서도 3개가 한 줄에 들어가게 ** */
  .stat strong { font-size: 14px; }

  /* ** 설명: 버튼을 가로로 꽉 채우기 // ** 이유: 엄지로 누르기 쉽게 ** */
  .actions .btn { flex: 1; }

  /*
    ** 설명: 표를 '카드 목록'으로 변신시킨다. 제목줄(thead)은 숨기고, 한 줄(tr)을 카드 하나로 // ** 이유: 폰에서 10칸짜리 표는 옆으로 계속 밀어야 해서 보기 힘들다 **
    td::before + attr(data-label) = script.js가 각 칸에 붙여 둔 "칸 이름"을 왼쪽에 글자로 보여주는 기술
  */
  .table-wrap { background: transparent; border: 0; overflow: visible; }
  .ledger:not(.settings-table) thead { display: none; }
  .ledger:not(.settings-table),
  .ledger:not(.settings-table) tbody,
  .ledger:not(.settings-table) tr,
  .ledger:not(.settings-table) td { display: block; width: 100%; }
  .ledger:not(.settings-table) tr {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 10px; padding: 6px 4px;
  }
  .ledger:not(.settings-table) td {
    display: flex; justify-content: space-between; gap: 12px;
    border-bottom: 1px dashed var(--line); padding: 8px 12px; white-space: normal; text-align: right;
  }
  .ledger:not(.settings-table) td:last-child { border-bottom: 0; justify-content: flex-end; }
  .ledger:not(.settings-table) td::before {
    content: attr(data-label);      /* 칸 이름 글자 */
    color: var(--muted); font-size: 12px; font-weight: 700; text-align: left;
  }
  .ledger:not(.settings-table) td:last-child::before { content: none; }
  .settings-table { font-size: 13px; }
}
</style>
